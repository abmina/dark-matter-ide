name: Dark Matter Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron

      - name: Set Version
        id: set_version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "DARK_MATTER_VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Build Application
        run: npm run gulp -- vscode-win32-x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DARK_MATTER_VERSION: ${{ env.DARK_MATTER_VERSION }}

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "../VSCode-win32-x64/*" -DestinationPath "./DarkMatter-win32-x64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMatter-win32-x64
          path: ./DarkMatter-win32-x64.zip

  build-linux:
    name: Linux x64 Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo rm -rf /var/lib/apt/lists/*
          for i in {1..5}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install Dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron

      - name: Set Version
        id: set_version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "DARK_MATTER_VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Build Application
        run: npm run gulp -- vscode-linux-x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DARK_MATTER_VERSION: ${{ env.DARK_MATTER_VERSION }}

      - name: Create tar.gz archive
        run: |
          tar -czf ./DarkMatter-linux-x64.tar.gz ../VSCode-linux-x64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMatter-linux-x64
          path: ./DarkMatter-linux-x64.tar.gz
