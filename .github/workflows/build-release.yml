name: Build & Release Dark Matter IDE

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write  # Needed to create releases

jobs:
  # ============================================================
  # Windows x64 Build
  # ============================================================
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version and commit into product.json
        shell: pwsh
        run: |
          $product = Get-Content product.json -Raw | ConvertFrom-Json
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          # Keep version as 1.116.0 for extension compatibility
          $product | Add-Member -Force -Name 'darkmatterVersion' -Value $tagVersion -MemberType NoteProperty
          $product | Add-Member -Force -Name 'commit' -Value '${{ github.sha }}' -MemberType NoteProperty
          $product | Add-Member -Force -Name 'date' -Value (Get-Date -Format 'yyyy-MM-ddTHH:mm:ss.fffZ') -MemberType NoteProperty
          $product | ConvertTo-Json -Depth 10 | Set-Content product.json -Encoding utf8
          Write-Output "Stamped darkmatterVersion=$tagVersion commit=${{ github.sha }}"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron

      - name: Build (production minified)
        run: npm run gulp -- vscode-win32-x64-min
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "../VSCode-win32-x64/*" -DestinationPath "./DarkMatter-win32-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Write-Output "Inno Setup installed"

      - name: Build inno-updater tools
        run: npm run gulp -- vscode-win32-x64-inno-updater

      - name: Build Windows Installer (.exe)
        run: npm run gulp -- vscode-win32-x64-user-setup
        continue-on-error: true

      - name: Rename installer
        shell: pwsh
        run: |
          $setupDir = ".build/win32-x64/user-setup"
          $exeFiles = Get-ChildItem "$setupDir/*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles -and $exeFiles.Count -gt 0) {
            Copy-Item $exeFiles[-1].FullName -Destination "./DarkMatter-win32-x64-Setup.exe"
            Write-Output "Installer renamed to DarkMatter-win32-x64-Setup.exe"
          } else {
            Write-Output "No installer .exe found — ZIP-only release"
          }
        continue-on-error: true

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMatter-win32-x64
          path: ./DarkMatter-win32-x64.zip

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('./DarkMatter-win32-x64-Setup.exe') != ''
        with:
          name: DarkMatter-win32-x64-Setup
          path: ./DarkMatter-win32-x64-Setup.exe
        continue-on-error: true

  # ============================================================
  # Linux x64 Build
  # ============================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version and commit into product.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          COMMIT="${{ github.sha }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          tmp=$(mktemp)
          # Update darkmatterVersion, keep version as-is for compatibility
          jq --arg v "$VERSION" --arg c "$COMMIT" --arg d "$DATE" \
            '. + {darkmatterVersion: $v, commit: $c, date: $d}' product.json > "$tmp" && mv "$tmp" product.json
          echo "Stamped darkmatterVersion=$VERSION commit=$COMMIT"

      - name: Install system dependencies
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo rm -rf /var/lib/apt/lists/*
          for i in {1..5}; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev rpm fakeroot dpkg debhelper ca-certificates

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: npm run electron

      - name: Build (production minified)
        run: npm run gulp -- vscode-linux-x64-min
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Create tar.gz archive
        run: |
          tar -czf ./DarkMatter-linux-x64.tar.gz --transform='s/VSCode-linux-x64/DarkMatter-linux-x64/' ../VSCode-linux-x64

      - name: Build .deb package
        run: |
          npm run gulp -- vscode-linux-x64-prepare-deb && npm run gulp -- vscode-linux-x64-build-deb
        continue-on-error: true

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMatter-linux-x64
          path: ./DarkMatter-linux-x64.tar.gz

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DarkMatter-linux-x64-deb
          path: .build/linux/deb/amd64/deb/*.deb
        continue-on-error: true

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: DarkMatter-win32-x64
          path: ./release

      - name: Download Windows Installer artifact
        uses: actions/download-artifact@v4
        with:
          name: DarkMatter-win32-x64-Setup
          path: ./release
        continue-on-error: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DarkMatter-linux-x64
          path: ./release

      - name: Download Linux .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: DarkMatter-linux-x64-deb
          path: ./release
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dark Matter IDE ${{ github.ref_name }}
          body: |
            ## Dark Matter IDE ${{ github.ref_name }}

            **AI-Powered Code Editor with Built-in Local LLM Integration**

            ### Downloads
            - 🪟 **Windows Installer**: `DarkMatter-win32-x64-Setup.exe` — Full installer with Start Menu & PATH integration
            - 🪟 **Windows Portable**: `DarkMatter-win32-x64.zip` — Extract and run `Dark Matter.exe`
            - 🐧 **Linux**: `DarkMatter-linux-x64.tar.gz` — Extract and run `./dark-matter`
            - 🐧 **Linux .deb**: `dark-matter_*.deb` — Install with `sudo dpkg -i`

            ### What's New in ${{ github.ref_name }}
            - **Unified OpenAI-compatible backend support** — Connect to Ollama, llama-server (llama.cpp), LM Studio, Jan, vLLM, or any `/v1/chat/completions`-compatible endpoint
            - **Fixed model name parsing** — Model tags with colons (e.g. `gemma3:4b`) are now handled correctly
            - **Fixed memory leak** — Cancellation token listeners are now properly disposed
            - **Improved extension scanning** — Non-extension directories (node_modules, out) are filtered to prevent startup errors
            - **Build pipeline stabilization** — Removed legacy upstream hygiene checks that caused CI failures
            - **Windows .exe installer** — Full InnoSetup-based installer with file associations and PATH integration

            ### Prerequisites
            - Run a local LLM backend (e.g. [Ollama](https://ollama.com), llama-server, LM Studio) and pull a model
            - Launch Dark Matter and start chatting with AI!

            ### Version Info
            - **Version**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
          files: ./release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
